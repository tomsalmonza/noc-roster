[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noc-roster-generator"
version = "0.1.0"
description = "Spec-driven NOC roster generator using OR-Tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ortools>=9.10.4067",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
]

[project.scripts]
noc-roster = "noc_roster.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
